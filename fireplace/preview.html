<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fireplace preview</title>
<style>
html,body{margin:0;background:#282828;color:#ccc;font:13px/1.4 system-ui,sans-serif}
#bar{display:flex;gap:16px;align-items:center;padding:10px 14px}
#bar button{font:inherit;padding:5px 12px;cursor:pointer}
#wrap{position:relative;margin:0 auto;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1680px;height:975px;transform-origin:0 0}
iframe{position:absolute;border:0;overflow:hidden;background:#1d3322}
</style></head>
<body>
    <div id="bar"><button id="replay">Replay</button><label><input type="checkbox" id="dbg"> layout overlay (50 %)</label></div>
    <div id="wrap"><div id="stage">
    <iframe id="f-left" src="left.html" width="320" height="975" scrolling="no" style="left:0;top:0"></iframe>
    <iframe id="f-top" src="top.html" width="1032" height="250" scrolling="no" style="left:324px;top:0"></iframe>
    <iframe id="f-right" src="right.html" width="320" height="975" scrolling="no" style="left:1360px;top:0"></iframe>
    </div></div>
<script src="assets/lib/gsap.min.js"></script>
<script src="script.js"></script>
</body>
</html>
