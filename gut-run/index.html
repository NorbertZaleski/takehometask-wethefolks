<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gut run AD</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
    <div id="stage">
        <div id="layer-texture"></div>

        <canvas id="canvas"></canvas>

        <header id="logo-bar"><img class="half" src="assets/game/logo.png" alt="Logo"></header>

        <button id="mute" aria-label="Sound on/off">ON</button>

        <img class="half frame" src="assets/game/border.png" alt="">
        
        <div id="headline">
            <img class="half" src="assets/game/tut.png" alt="Bringe Poo durch den Darm ans Ziel.">
        </div>

        <section id="start" class="screen show">
            <div id="start-screen">
                <div class="content">
                    <img class="half" id="gesture" src="assets/game/gesture.png">
                </div>

            </div>
        </section>
        

        <section id="win" class="screen">
            <img class="half item bubble" src="assets/end/win/bubble.png" alt="">
            <img class="half item poo" src="assets/end/win/happy.png" alt="">
            <img class="half item hl" src="assets/end/win/hl.png" alt="">
            <button class="item btn cta" data-cta>
                <img class="half" src="assets/end/win/cta.png" alt="Jetzt informieren!">
            </button>
            <img class="half confetti" src="assets/end/win/konfetti.png" alt="">
        </section>


        <section id="fail" class="screen">
            <img class="half item bubble" src="assets/end/win/bubble.png" alt="">

            <img class="half item bac" src="assets/end/fail/bac1.png" alt="">
            <img class="half item bac" src="assets/end/fail/bac2.png" alt="">
            <img class="half item bac" src="assets/end/fail/bac3.png" alt="">
            <img class="half item bac" src="assets/end/fail/bac4.png" alt="">
            <img class="half item bac" src="assets/end/fail/bac5.png" alt="">

            <img class="half item poo" src="assets/end/fail/sad.png" alt="">
            <img class="half item hl" src="assets/end/fail/hl.png" alt="Poo, das tat weh! Erfahre jetzt, was deinem Darm guttut.">

            <button class="item btn cta" data-cta>
                <img class="half" src="assets/end/fail/cta.png" alt="Jetzt informieren!">
            </button>
            <button class="item btn replay" id="replay">
                <img class="half" src="assets/end/fail/replay.png" alt="Nochmal spielen">
            </button>
        </section>

    </div>
<script src="assets/lib/gsap.min.js"></script>
<script src="script.js"></script>
</body>
</html>
